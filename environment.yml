name: io-agent
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  
  - numpy=1.26.4
  - scipy=1.11.4
  - pandas=2.1.4
  - scikit-learn=1.4.0
  
  - matplotlib=3.8.2
  - seaborn=0.13.1
  - plotly=5.18.0
  - tqdm=4.66.1
  
  - sympy=1.12
  
  - notebook=7.0.6
  - ipykernel=6.28.0
  - ipywidgets
  
  - cvxpy=1.4.2
  
  - mkl=2024.0.0
  - pytorch=1.13.1
  - pytorch-cuda=11.7
  
  - gymnasium=0.29.1
  - mujoco=3.1.1
  
  - pip:
      - -e .
      - Cython<3.0
      - mujoco_py
      - pybullet==3.2.6
      - mosek==10.1.28
      - safe-control-gym @ git+https://github.com/utiasDSL/safe-control-gym.git@dd9fcb6e6b894045d706efd6b73f25724f502d2e
      - d4rl @ git+https://github.com/Farama-Foundation/D4RL.git@89141a689b0353b0dac3da5cba60da4b1b16254d
      - offlinerlkit @ git+https://github.com/yihaosun1124/OfflineRL-Kit.git@e3ce69793766d02660217d4dfc0af4693a5531bd
      - stable-baselines3==2.2.1
      - jax[cuda11_pip]==0.4.31
      - jaxopt==0.8.3
      - jaxtyping==0.2.25
      - optax==0.2.3
      - tensorboard==2.15.1
      - imageio==2.33.1
      - imageio-ffmpeg==0.4.9
